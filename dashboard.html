<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .modal { display: none; }
        .modal.is-open { display: flex; }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href=""><h1 class="text-xl font-bold text-gray-800">Media Platform</h1></a>
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                    <span id="userEmail" class="text-sm font-medium text-gray-700"></span>
                </div>
                <button id="logoutButton" class="bg-red-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-red-600 transition">Logout</button>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-8">
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Available Media</h2>
            <div id="mediaList" class="space-y-4">
                <!-- Media items will be injected here -->
            </div>
        </div>
    </main>

    <!-- Stream URL Modal -->
    <div id="streamModal" class="modal fixed inset-0 bg-black bg-opacity-50 items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-lg">
            <h3 class="text-lg font-semibold text-gray-800">Secure Stream URL</h3>
            <p class="text-sm text-gray-500 mt-1">This link is valid for 10 minutes.</p>
            <div class="mt-4 p-3 bg-gray-100 rounded-lg text-xs text-gray-600 break-words" id="streamUrlDisplay"></div>
            <button id="closeModal" class="mt-6 w-full bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-lg hover:bg-gray-300">Close</button>
        </div>
    </div>
    
    <script>
        const token = sessionStorage.getItem('accessToken');
        const userEmail = sessionStorage.getItem('userEmail');
        const userEmailDisplay = document.getElementById('userEmail');
        const mediaList = document.getElementById('mediaList');
        const logoutButton = document.getElementById('logoutButton');
        const streamModal = document.getElementById('streamModal');
        const closeModal = document.getElementById('closeModal');
        const streamUrlDisplay = document.getElementById('streamUrlDisplay');

        window.onload = () => {
            if (!token || !userEmail) {
                window.location.href = '/login';
                return;
            }
            userEmailDisplay.textContent = userEmail;
            fetchMedia();
        };

        async function fetchMedia() {
            try {
                const response = await fetch('/media/', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Failed to fetch media');
                const mediaItems = await response.json();
                mediaList.innerHTML = '';
                if (mediaItems.length === 0) {
                    mediaList.innerHTML = `<p class="text-gray-500">No media available yet.</p>`;
                } else {
                    mediaItems.forEach(item => {
                        const mediaElement = document.createElement('div');
                        mediaElement.className = 'p-4 border rounded-lg flex justify-between items-center';
                        mediaElement.innerHTML = `
                            <div>
                                <p class="font-semibold">${item.title}</p>
                                <p class="text-sm text-gray-500">Uploaded by: <span class="font-medium">${item.owner.email}</span></p>
                            </div>
                            <button onclick="getStreamUrl(${item.id})" class="bg-green-500 text-white text-sm font-bold py-1 px-3 rounded-lg hover:bg-green-600">Stream</button>
                        `;
                        mediaList.appendChild(mediaElement);
                    });
                }
            } catch (error) {
                console.error('Failed to fetch media:', error);
                mediaList.innerHTML = `<p class="text-red-500">Error loading media.</p>`;
            }
        }

        async function getStreamUrl(mediaId) {
            try {
                await fetch(`/media/${mediaId}/view`, { method: 'POST' });
                const response = await fetch(`/media/${mediaId}/stream-url`);
                const data = await response.json();
                if (response.ok) {
                    streamUrlDisplay.textContent = data.stream_url;
                    streamModal.classList.add('is-open');
                } else {
                    alert(`Error: ${data.detail}`);
                }
            } catch (error) {
                console.error('Failed to get stream URL:', error);
                alert('Could not retrieve stream URL.');
            }
        }

        closeModal.addEventListener('click', () => streamModal.classList.remove('is-open'));
        logoutButton.addEventListener('click', () => {
            sessionStorage.clear();
            window.location.href = '/login';
        });
    </script>
</body>
</html>
