<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .modal { display: none; }
        .modal.is-open { display: flex; }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">Media Platform Dashboard</h1>
            <div class="flex items-center space-x-4">
                <!-- Profile Icon and Email -->
                <div class="flex items-center space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span id="userEmail" class="text-sm font-medium text-gray-700"></span>
                </div>
                <button id="logoutButton" class="bg-red-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-red-600 transition duration-300">
                    Logout
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Upload Form -->
            <div class="md:col-span-1 bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Upload Media</h2>
                <form id="uploadForm">
                    <div class="mb-4">
                        <label for="title" class="block text-gray-700 text-sm font-medium mb-2">Media Title</label>
                        <input type="text" id="title" name="title" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div class="mb-6">
                        <label for="file" class="block text-gray-700 text-sm font-medium mb-2">Media File</label>
                        <input type="file" id="file" name="file" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" required>
                    </div>
                    <button type="submit" id="uploadButton" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-300">
                        Upload
                    </button>
                </form>
                <div id="uploadMessage" class="mt-4 text-center text-sm"></div>
            </div>

            <!-- Media List -->
            <div class="md:col-span-2 bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Uploaded Media</h2>
                <div id="mediaList" class="space-y-4">
                    <!-- Media items will be injected here by JavaScript -->
                </div>
            </div>
        </div>
    </main>

    <!-- Stream URL Modal -->
    <div id="streamModal" class="modal fixed inset-0 bg-black bg-opacity-50 items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-lg">
            <h3 class="text-lg font-semibold text-gray-800">Secure Stream URL</h3>
            <p class="text-sm text-gray-500 mt-1">This link is valid for 10 minutes.</p>
            <div class="mt-4 p-3 bg-gray-100 rounded-lg text-xs text-gray-600 break-words" id="streamUrlDisplay"></div>
            <button id="closeModal" class="mt-6 w-full bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-lg hover:bg-gray-300 transition duration-300">
                Close
            </button>
        </div>
    </div>

    <script>
        const token = sessionStorage.getItem('accessToken');
        const userEmail = sessionStorage.getItem('userEmail');
        const uploadForm = document.getElementById('uploadForm');
        const uploadMessage = document.getElementById('uploadMessage');
        const mediaList = document.getElementById('mediaList');
        const logoutButton = document.getElementById('logoutButton');
        const streamModal = document.getElementById('streamModal');
        const streamUrlDisplay = document.getElementById('streamUrlDisplay');
        const closeModal = document.getElementById('closeModal');
        const userEmailDisplay = document.getElementById('userEmail');

        // 1. Check for token and email on page load
        window.onload = () => {
            if (!token || !userEmail) {
                window.location.href = '/login';
                return;
            }
            // Display the logged-in user's email
            userEmailDisplay.textContent = userEmail;
            fetchMedia();
        };

        // 2. Fetch and display all media
        async function fetchMedia() {
            try {
                const response = await fetch('http://127.0.0.1:8000/media/', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                const mediaItems = await response.json();
                mediaList.innerHTML = '';
                if (mediaItems.length === 0) {
                    mediaList.innerHTML = `<p class="text-gray-500">No media uploaded yet.</p>`;
                } else {
                    mediaItems.forEach(item => {
                        const mediaElement = document.createElement('div');
                        mediaElement.className = 'p-4 border rounded-lg flex justify-between items-center';
                        mediaElement.innerHTML = `
                            <div>
                                <p class="font-semibold">${item.title}</p>
                                <p class="text-sm text-gray-500">
                                    Uploaded by: <span class="font-medium">${item.owner.email}</span>
                                </p>
                            </div>
                            <button onclick="getStreamUrl(${item.id})" class="bg-green-500 text-white text-sm font-bold py-1 px-3 rounded-lg hover:bg-green-600 transition">
                                Get Link
                            </button>
                        `;
                        mediaList.appendChild(mediaElement);
                    });
                }
            } catch (error) {
                console.error('Failed to fetch media:', error);
                mediaList.innerHTML = `<p class="text-red-500">Error loading media.</p>`;
            }
        }

        // 3. Handle media upload
        uploadForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const title = document.getElementById('title').value;
            const file = document.getElementById('file').files[0];
            const uploadButton = document.getElementById('uploadButton');

            if (!file) {
                uploadMessage.textContent = 'Please select a file.';
                uploadMessage.className = 'mt-4 text-center text-sm text-red-600';
                return;
            }

            const formData = new FormData();
            formData.append('title', title);
            formData.append('file', file);
            
            uploadMessage.textContent = 'Uploading...';
            uploadMessage.className = 'mt-4 text-center text-sm text-blue-600';
            uploadButton.disabled = true;

            try {
                const response = await fetch('http://127.0.0.1:8000/media/', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData,
                });

                const data = await response.json();
                if (response.ok) {
                    uploadMessage.textContent = 'Upload successful!';
                    uploadMessage.className = 'mt-4 text-center text-sm text-green-600';
                    uploadForm.reset();
                    fetchMedia(); // Refresh the list
                } else {
                    uploadMessage.textContent = data.detail || 'Upload failed.';
                    uploadMessage.className = 'mt-4 text-center text-sm text-red-600';
                }
            } catch (error) {
                console.error('Upload error:', error);
                uploadMessage.textContent = 'An error occurred.';
                uploadMessage.className = 'mt-4 text-center text-sm text-red-600';
            } finally {
                uploadButton.disabled = false;
            }
        });

        // 4. Get secure stream URL
        async function getStreamUrl(mediaId) {
            try {
                const response = await fetch(`http://127.0.0.1:8000/media/${mediaId}/stream-url`);
                const data = await response.json();
                if (response.ok) {
                    streamUrlDisplay.textContent = data.stream_url;
                    streamModal.classList.add('is-open');
                } else {
                    alert(`Error: ${data.detail}`);
                }
            } catch (error) {
                console.error('Failed to get stream URL:', error);
                alert('Could not retrieve stream URL.');
            }
        }

        // 5. Modal and Logout functionality
        closeModal.addEventListener('click', () => streamModal.classList.remove('is-open'));
        logoutButton.addEventListener('click', () => {
            sessionStorage.clear(); // Clear all session data on logout
            window.location.href = '/login';
        });

    </script>
</body>
</html>
