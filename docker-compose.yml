version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: media_platform_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: