<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Platform Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Create Account</h2>
        
        <!-- Signup Form -->
        <form id="signupForm">
            <div class="mb-4">
                <label for="email" class="block text-gray-700 text-sm font-medium mb-2">Email Address</label>
                <input type="email" id="email" name="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="admin@example.com" required>
            </div>
            <div class="mb-6">
                <label for="password" class="block text-gray-700 text-sm font-medium mb-2">Password</label>
                <input type="password" id="password" name="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••" required>
            </div>
            <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-700 transition duration-300">
                Create Account
            </button>
        </form>

        <!-- Message Area -->
        <div id="message" class="mt-6 text-center text-sm"></div>
        
        <!-- Link to Login -->
        <div class="mt-4 text-center">
            <!-- THIS LINK IS NOW FIXED -->
            <a href="/login" class="text-sm text-blue-600 hover:underline">Already have an account? Login</a>
        </div>
    </div>

    <script>
        const signupForm = document.getElementById('signupForm');
        const messageDiv = document.getElementById('message');

        signupForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            messageDiv.textContent = '';
            messageDiv.className = 'mt-6 text-center text-sm';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://127.0.0.1:8000/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                    }),
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.textContent = 'Account created successfully! You can now log in.';
                    messageDiv.classList.add('text-green-600');
                    signupForm.reset(); // Clear the form
                } else {
                    messageDiv.textContent = data.detail || 'An error occurred during signup.';
                    messageDiv.classList.add('text-red-600');
                }

            } catch (error) {
                console.error('Signup failed:', error);
                messageDiv.textContent = 'Could not connect to the server. Is it running?';
                messageDiv.classList.add('text-red-600');
            }
        });
    </script>
</body>
</html>
