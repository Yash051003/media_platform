<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Platform Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Admin Login</h2>
        
        <form id="loginForm">
            <div class="mb-4">
                <label for="email" class="block text-gray-700 text-sm font-medium mb-2">Email Address</label>
                <input type="email" id="email" name="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="admin@example.com" required>
            </div>
            <div class="mb-6">
                <label for="password" class="block text-gray-700 text-sm font-medium mb-2">Password</label>
                <input type="password" id="password" name="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-300">
                Login
            </button>
        </form>

        <div id="message" class="mt-6 text-center text-sm"></div>

        <div class="mt-4 text-center">
            <a href="/" class="text-sm text-blue-600 hover:underline">Don't have an account? Sign Up</a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const messageDiv = document.getElementById('message');

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault(); 

            messageDiv.textContent = '';
            messageDiv.className = 'mt-6 text-center text-sm';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://127.0.0.1:8000/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password }),
                });

                const data = await response.json();

                if (response.ok) {
                    // --- THIS IS THE KEY CHANGE ---
                    // 1. Save the token to session storage
                    sessionStorage.setItem('accessToken', data.access_token);
                    // 2. Save the user's email as well
                    sessionStorage.setItem('userEmail', email);
                    
                    // 3. Redirect to the dashboard
                    window.location.href = '/dashboard';

                } else {
                    messageDiv.textContent = data.detail || 'An error occurred.';
                    messageDiv.classList.add('text-red-600');
                }

            } catch (error) {
                console.error('Login failed:', error);
                messageDiv.textContent = 'Could not connect to the server. Is it running?';
                messageDiv.classList.add('text-red-600');
            }
        });
    </script>
</body>
</html>
